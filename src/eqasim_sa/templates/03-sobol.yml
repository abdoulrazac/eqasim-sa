# N=4 and D=3: 32 positions and 8 unique runs for this deterministic sample.
campaign: @PROJECT_NAME@-sobol
campaign_root: ../campaigns/sobol
model:
  config: @MODEL_CONFIG@
  root: @MODEL_ROOT@
context:
  data_manifest: @DATA_MANIFEST@
  lockfile: @LOCKFILE@
analysis:
  completeness_threshold: 1.0
  bootstrap_resamples: 99
  confidence_level: 0.95
experiment:
  method: sobol
  seed_role: factor
  base_sample_size: 4
  design_seed: 20260814
parameters:
  sampling_rate:
    values: [0.001, 0.002]
  matching_age_scheme:
    values: [matching_6, analysis_7]
  seed:
    values: [1401, 1402]
artifacts:
  age:
    class: Age class
    synthetic: Proportion_EQASIM
    references: [INSEE]
  distance:
    class: Distance class
    synthetic: Proportion_EQASIM
    references: [HTS, HTS adjust with INSEE population weights]
  nbr_vehicle:
    class: Number of vehicles class
    synthetic: Proportion_EQASIM
    references: [HTS, HTS adjust with INSEE population weights]
indicators:
  - pair:
      scalarizer: tv_distance
      artifact: age
      reference: INSEE
  - product:
      scalarizers: [tv_distance]
      artifacts: [distance, nbr_vehicle]
execution:
  backend: local
  workers: 2
  scratch: @SCRATCH@
  invocation: @INVOCATION@
  overrides:
    data_path: @DATA_PATH@
    processes: 1
calibration:
  meta_configs: [00-calibration.yml]
