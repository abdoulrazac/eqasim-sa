# Discrete adjacent-level OAT demonstration: eight positions, not Morris inference.
campaign: @PROJECT_NAME@-discrete_oat
campaign_root: ../campaigns/discrete_oat
charter:
  status: demonstration
model:
  config: @MODEL_CONFIG@
  root: @MODEL_ROOT@
  data_manifest: @DATA_MANIFEST@
  lockfile: @LOCKFILE@
analysis:
  completeness_threshold: 1.0
experiment:
  method: discrete_oat
  trajectories: 2
  design_seed: 20260817
  seeds: [1301, 1302]
parameters:
  sampling_rate:
    values: [0.001, 0.002, 0.003]
outputs:
  age:
    category: Age class
    simulated: Proportion_EQASIM
    references: [INSEE]
  distance:
    category: Distance class
    simulated: Proportion_EQASIM
    references: [HTS]
  nbr_vehicle:
    category: Number of vehicles class
    simulated: Proportion_EQASIM
    references: [HTS]
indicators:
  - tv_distance:
      output: age
      reference: INSEE
  - tv_distance:
      outputs: [distance, nbr_vehicle]
execution:
  backend: local
  workers: 2
  scratch: @SCRATCH@
  invocation: @INVOCATION@
  machine_options:
    data_path: @DATA_PATH@
    processes: 1
calibration:
  meta_configs: [00-calibration.yml]
