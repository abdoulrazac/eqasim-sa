# Discrete adjacent-level OAT demonstration: eight positions, not Morris inference.
campaign: @PROJECT_NAME@-discrete_oat
experiment:
  method: discrete_oat
  seeds: [1301, 1302]
  trajectories: 2
parameters:
  sampling_rate: [0.001, 0.002, 0.003]
outputs:
  age:
    category: Age class
    simulated: Proportion_EQASIM
    references: [INSEE]
  distance:
    category: Distance class
    simulated: Proportion_EQASIM
    references: [HTS]
  nbr_vehicle:
    category: Number of vehicles class
    simulated: Proportion_EQASIM
    references: [HTS]
calibration:
  meta_configs: [00-calibration.yml]
# --- Rempli par eqasim-sa init : à modifier seulement si la machine change ---
model:
  root: @MODEL_ROOT@
  config: @MODEL_CONFIG@
  data_manifest: @DATA_MANIFEST@
execution:
  workers: 2
  scratch: @SCRATCH@
@INVOCATION_LINE@  machine_options:
    data_path: @DATA_PATH@
    processes: 1
