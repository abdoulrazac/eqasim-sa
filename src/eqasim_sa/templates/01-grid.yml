# Two rates by two matching schemes by two seeds: eight positions and eight unique runs.
campaign: @PROJECT_NAME@-grid
campaign_root: ../campaigns/grid
charter:
  status: demonstration
model:
  config: @MODEL_CONFIG@
  root: @MODEL_ROOT@
  data_manifest: @DATA_MANIFEST@
  lockfile: @LOCKFILE@
analysis:
  completeness_threshold: 1.0
experiment:
  method: grid
  seeds: [1201, 1202]
parameters:
  sampling_rate:
    values: [0.001, 0.002]
  matching_age_scheme:
    values: [matching_6, analysis_7]
outputs:
  age:
    category: Age class
    simulated: Proportion_EQASIM
    references: [INSEE]
  distance:
    category: Distance class
    simulated: Proportion_EQASIM
    references: [HTS]
  nbr_vehicle:
    category: Number of vehicles class
    simulated: Proportion_EQASIM
    references: [HTS]
indicators:
  - tv_distance:
      output: age
      reference: INSEE
  - tv_distance:
      outputs: [distance, nbr_vehicle]
execution:
  backend: local
  workers: 2
  scratch: @SCRATCH@
  invocation: @INVOCATION@
  machine_options:
    data_path: @DATA_PATH@
    processes: 1
calibration:
  meta_configs: [00-calibration.yml]
