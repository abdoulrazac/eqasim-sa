# Two rates by two matching schemes by two seeds: eight positions and eight unique runs.
campaign: @PROJECT_NAME@-grid
campaign_root: ../campaigns/grid
charter:
  status: demonstration
model:
  config: @MODEL_CONFIG@
  root: @MODEL_ROOT@
context:
  data_manifest: @DATA_MANIFEST@
  lockfile: @LOCKFILE@
analysis:
  completeness_threshold: 1.0
experiment:
  method: grid
  seed_role: replication
  replications:
    seeds: [1201, 1202]
parameters:
  sampling_rate:
    values: [0.001, 0.002]
  matching_age_scheme:
    values: [matching_6, analysis_7]
artifacts:
  age:
    class: Age class
    synthetic: Proportion_EQASIM
    references: [INSEE]
  distance:
    class: Distance class
    synthetic: Proportion_EQASIM
    references: [HTS]
  nbr_vehicle:
    class: Number of vehicles class
    synthetic: Proportion_EQASIM
    references: [HTS]
indicators:
  - pair:
      scalarizer: tv_distance
      artifact: age
      reference: INSEE
  - product:
      scalarizers: [tv_distance]
      artifacts: [distance, nbr_vehicle]
execution:
  backend: local
  workers: 2
  scratch: @SCRATCH@
  invocation: @INVOCATION@
  overrides:
    data_path: @DATA_PATH@
    processes: 1
calibration:
  meta_configs: [00-calibration.yml]
