# Two rates by two seeds: four positions and four unique runs.
# Prerequisite: in your copy of the eqasim configuration, add
# `analysis.synthesis.population` to `run:` (the age, distance and nbr_vehicle
# outputs come from that stage); eqasim-sa checks it when loading.
campaign: @PROJECT_NAME@-grid
experiment:
  method: grid
  seeds: [1201, 1202]
parameters:
  sampling_rate: [0.001, 0.002]
  # To vary another parameter, write it in the config: section of your eqasim
  # configuration first, then add it here, e.g.
  # matching_minimum_age: [0, 5, 12]
outputs:
  persons: {}
  households: {}
  trips: {}
  activities: {}
  activities_spatial: {}
  age:
    category: Age class
    simulated: Proportion_EQASIM
    references: [INSEE]
  distance:
    category: Distance class
    simulated: Proportion_EQASIM
    references: [HTS]
  nbr_vehicle:
    category: Number of vehicles class
    simulated: Proportion_EQASIM
    references: [HTS]
calibration:
  meta_configs: [00-calibration.yml]
# --- Machine-specific values ---
# eqasim-sa init fills in campaign (above), the paths below and, when given,
# the eqasim command, and compares them when it is rerun: edit them only when
# the machine changes. workers and machine_options.processes are yours:
# change them freely.
model:
  root: @MODEL_ROOT@
  config: @MODEL_CONFIG@
  data_manifest: @DATA_MANIFEST@
execution:
  workers: 2
  scratch: @SCRATCH@
@INVOCATION_LINE@  machine_options:
    data_path: @DATA_PATH@
    processes: 1
