[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eqasim-sa"
version = "0.2.0"
description = "Sensitivity-analysis runner for eqasim pipelines"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow==23.0.1",
    "PyYAML==6.0.3",
    "submitit==1.5.4",
    "numpy==2.3.5",
    "scipy==1.17.1",
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
eqasim-sa = "eqasim_sa.adapters.application:main"
eqasim-sa-fake-pipeline = "eqasim_sa.adapters.fake.executable:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqasim_sa = ["templates/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
