[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eqasim-sa"
version = "0.4.0"
description = "Sensitivity-analysis runner for eqasim pipelines"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyarrow==23.0.1",
    "PyYAML==6.0.3",
    "submitit==1.5.4",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
    "SALib==1.5.2",
    "scipy==1.17.1",
]

[project.urls]
Repository = "https://github.com/abdoulrazac/eqasim-sa"
Changelog = "https://github.com/abdoulrazac/eqasim-sa/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest==9.0.2", "cloudpickle==3.1.2", "pillow==12.3.0"]

[project.scripts]
eqasim-sa = "eqasim_sa.launcher:main"
eqasim-sa-fake-pipeline = "eqasim_sa.adapters.fake.executable:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eqasim_sa = ["templates/*.yml", "templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
    "posix_only: test runs only on POSIX platforms",
    "windows_only: test runs only on Windows",
    "linux_only: test runs only on Linux (the slurm backend)",
]
