name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.13
      - run: uv lock --check
      - run: uv run --locked --extra test pytest -q
      - run: uv build --out-dir dist
      - name: Verify the wheel resource boundary
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv run --locked python .github/scripts/verify_release_wheel.py \
            "dist/eqasim_sa-${version}-py3-none-any.whl"
          test -f "dist/eqasim_sa-${version}.tar.gz"
      - name: Export the tested runtime versions
        run: uv export --locked --no-hashes --no-emit-project --no-header --format requirements-txt -o dist/constraints.txt
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/eqasim_sa-${version}-py3-none-any.whl" \
            "dist/eqasim_sa-${version}.tar.gz" \
            dist/constraints.txt \
            --title "eqasim-sa ${version}" \
            --notes "See CHANGELOG.md for the changes in this release." \
            --verify-tag
