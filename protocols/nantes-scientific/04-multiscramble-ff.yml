# BLOCKED until a complete, converged conditional screening root is verified.
campaign: nantes-scientific-multiscramble-ff-v1
campaign_root: "__MACHINE_MULTISCRAMBLE_FF_ROOT__"
charter:
  status: scientific
  decision:
    claim: Identify whether either declared Nantes numerical factor is fixable within the total-order tolerance including interactions
    use: diagnostic
    setting: Loire-Atlantique department 44 population synthesis using INSEE RP 2022 and EDGT 44
    objective: ff
    estimand: Total-order Sobol upper confidence bounds for age total-variation distance over the two declared numerical factors and finite seed support
    primary_indicator: tv_distance(age, ref=INSEE)
    practical_tolerance: 0.05
  uncertainty:
    dependence:
      kind: independent
      rationale: Multi-scramble Sobol attribution requires independent declared factor coordinates
    inventory:
      parameters:
        - name: matching_minimum_observations
          status: varied
          provenance: Production screening report sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
          rationale: Conservatively retained because screening cannot justify fixing
        - name: matching_minimum_age
          status: varied
          provenance: Production screening report sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
          rationale: Conservatively retained because screening cannot justify fixing
        - name: seed
          status: varied
          provenance: Declared finite nuisance support; screening provenance sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
          rationale: Stochastic nuisance retained diagnostically but never classified as fixable
        - name: sampling_rate
          status: fixed
          provenance: Nantes eqasim configuration copy used for the campaign
          rationale: Fixed at 0.001 and assessed only as numerical robustness
      data:
        - name: INSEE_RP_2022
          status: fixed
          provenance: INSEE RP 2022 for Loire-Atlantique department 44
          rationale: Fixed primary age reference; alternatives are robustness-only
        - name: EDGT_44
          status: fixed
          provenance: EDGT 44 household travel survey
          rationale: Fixed secondary distance and vehicle-count reference
      structures:
        - name: population_synthesis_structure
          status: excluded
          provenance: eqasim-france/synthesis/population/matched.py and eqasim-france/analysis/synthesis/population.py
          rationale: Projection, location, income, vehicle, and mode-choice alternatives are robustness-only
      scenarios:
        - name: policy_and_mode_choice_scenario
          status: excluded
          provenance: Baseline Nantes scenario declaration
          rationale: Scenario changes require separate campaigns
      numerics:
        - name: qmc_scramble
          status: fixed
          provenance: Four independently randomized declared Sobol scrambles
          rationale: Scrambles quantify estimator uncertainty and are not row-bootstrap pseudo-replicates
        - name: process_count
          status: fixed
          provenance: Sealed execution override
          rationale: Requires a separate determinism check
  budget:
    maximum_runs: 2560
    reserve_fraction: 0.2
  stopping:
    criteria:
      - metric: ci_width
        threshold: 0.05
        consecutive_checks: 2
  robustness:
    checks:
      - name: Process-count determinism
        rationale: Compare identical factor and seed settings across process counts
      - name: Numerical-factor support sensitivity
        rationale: Reassess total-order upper bounds under defensible alternative supports
      - name: Sampling-rate and age-scheme robustness
        rationale: Check numerical sampling and structural age choices outside attribution
      - name: Survey and distance-definition robustness
        rationale: Check reference choice and disclose Euclidean versus routed-distance asymmetry
      - name: Structural and scenario alternatives
        rationale: Check projection, location, income, vehicle, mode choice, and scenarios separately
      - name: Direct-run confirmation
        rationale: Confirm every proposed fixing decision with new direct runs at fixed and varied values
  stochastic:
    target: finite_seed_factor
    random_source: simulator_seed
    intrinsic_variance: not_identified
    common_random_numbers: none
    support_interpretation: declared_finite_nuisance
model:
  config: "__MACHINE_MODEL_CONFIG__"
  root: "__MACHINE_MODEL_ROOT__"
  data_manifest: "__MACHINE_DATA_MANIFEST__"
  lockfile: "__MACHINE_LOCKFILE__"
analysis:
  completeness_threshold: 1.0
  confidence_level: 0.95
experiment:
  method: multiscramble_sobol
  seeds: [44011, 44012, 44013, 44014]
  seeds_provenance: Declared finite simulator-seed nuisance support; screening sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
  base_sample_sizes: [16, 32, 64]
  scramble_seeds: [44201, 44202, 44203, 44204]
parameters:
  matching_minimum_observations:
    values: [5, 20, 50]
    distribution:
      family: discrete_uniform
      transform: identity
      provenance: Production screening report sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
  matching_minimum_age:
    values: [0, 5, 12]
    distribution:
      family: discrete_uniform
      transform: identity
      provenance: Production screening report sha256:__BLOCKED_SCREENING_PROVENANCE_SHA256__
outputs:
  age: {category: Age class, simulated: Proportion_EQASIM, references: [INSEE]}
  distance: {category: Distance class, simulated: Proportion_EQASIM, references: [HTS]}
  nbr_vehicle: {category: Number of vehicles class, simulated: Proportion_EQASIM, references: [HTS]}
indicators:
  - tv_distance: {output: age, reference: INSEE}
  - tv_distance: {outputs: [distance, nbr_vehicle]}
execution:
  backend: local
  workers: 1
  scratch: "__MACHINE_SCRATCH__"
  invocation: [uv, run, --locked, python, -m, synpp]
  machine_options:
    data_path: "__MACHINE_DATA_PATH__"
    processes: 1
